[versions]
agp = "8.9.2"
kotlin = "2.0.21"
coreKtx = "1.10.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.6.1"
material = "1.8.0"
activity = "1.7.2"
constraintlayout = "2.1.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
ktsh = { module = "com.jaredrummler:ktsh", version = "1.0.0" }
netty = { module = "io.netty:netty-all", version = "4.1.106.Final" }
androidx-lifecycle-extensions = { group = "androidx.lifecycle", name = "lifecycle-extensions", version = "2.2.0" }
jackson-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version = "2.15.2"}
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version = "21.3.0" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version = "1.7.3" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version = "1.5.4" }
greenrobot-eventbus = { group = "org.greenrobot", name = "eventbus", version = "3.3.1" }
# webrtc = { module = "com.dafruits:webrtc", version = "123.0.0" }
webrtc = { module = "com.mesibo.api:webrtc", version = "1.0.5" }
# webrtc = { module = "io.getstream:stream-webrtc-android", version = "1.1.1" }
gson = { group = "com.google.code.gson", name = "gson", version = "2.13.1" }
pedroSG94 = { module = "com.github.pedroSG94.RootEncoder:rtplibrary", version = "2.2.6" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
